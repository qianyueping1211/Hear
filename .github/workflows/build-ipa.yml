name: Build IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.hear.app
      TEAM_ID: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch llama.xcframework
        run: bash scripts/fetch_llama.sh

      - name: Prepare app icon
        run: bash scripts/prepare_assets.sh

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Hear.xcodeproj \
            -scheme Hear \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          if ! test -f build/Build/Products/Release-iphoneos/Hear.app/Hear; then
            echo "::error::编译失败，错误如下："
            grep -E "error:" build.log | sed 's|.*/Hear/Hear/||' | sort -u | head -40
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Hear.app Payload/
          zip -qry Hear.ipa Payload
          ls -lh Hear.ipa

      - name: Publish release
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="build-${{ github.run_number }}"
          {
            echo "## 听见 第 ${{ github.run_number }} 版"
            echo ""
            echo "**更新内容：** $(printf '%s' "${COMMIT_MSG:-手动打包}" | head -1)"
            echo ""
            echo "llama.cpp：$(cat Frameworks/LLAMA_VERSION)"
            echo ""
            echo "### 安装"
            echo "1. 下载下面的 \`Hear.ipa\`"
            echo "2. 用 [Sideloadly](https://sideloadly.io) + 你的 Apple ID 安装到 iPhone"
            echo "3. 已安装过的直接覆盖安装，模型不用重新下载"
          } > notes.md
          gh release create "$TAG" Hear.ipa \
            --title "听见 第 ${{ github.run_number }} 版" \
            --notes-file notes.md \
            --latest

      # 只在失败时上传编译日志，方便排查；安装包只发布到 Releases
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
