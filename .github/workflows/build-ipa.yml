name: Build IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 只改发布命名等工作流配置时不重新打包 App
    # 只改电脑上的服务端脚本（server/）时也不用重新打包 App
    paths-ignore:
      - .github/workflows/build-ipa.yml
      - .github/workflows/build-windows.yml
      - .github/workflows/build-windows-server.yml
      - .github/workflows/build-macos-server.yml
      - .github/workflows/rename-releases.yml
      - .github/workflows/server-contract.yml
      - 'desktop/**'
      - 'apps/desktop/**'
      - scripts/prepare_desktop_icons.py
      - scripts/sync_desktop_version.py
      - apps/README.md
      - 'apps/android/**'
      - 'apps/harmony/**'
      - 'server/**'
      - 'docs/**'
      - README.md

permissions:
  contents: write

# 新提交来了就取消还在排队/运行的旧打包，节省排队时间
concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: hear.yueping1211.asia.app
      TEAM_ID: ""
      GH_TOKEN: ${{ github.token }}
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no release]') }}
    steps:
      - uses: actions/checkout@v5

      # 证书和私钥绝对不能进仓库（2026-11 误提交过一次，已经作废重签了）
      - name: Guard against committed secrets
        run: |
          BAD=$(git ls-files | grep -Ei '\.(pem|key|p12|pfx|jks)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::仓库里有证书/私钥文件，请删掉并加进 .gitignore："
            echo "$BAD"
            exit 1
          fi
          PAT="PRIVATE ""KEY"
          HITS=$(git grep -Il -e "$PAT" -- . || true)
          if [ -n "$HITS" ]; then
            echo "::error::仓库里有私钥内容，不能提交："
            echo "$HITS"
            exit 1
          fi
          echo "✅ 仓库里没有证书/私钥"


      # iOS 版本号写在 apps/ios/VERSION 文件里（三位，例如 1.0.0），每次发布前改这个文件
      - name: Version
        run: |
          VER=$(tr -d ' \r\n' < apps/ios/VERSION)
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION 文件格式不对：$VER（应为 1.0.0 这样的三位）"; exit 1; }
          if [ "$PUBLISH_RELEASE" = "true" ] && gh release view "v$VER" >/dev/null 2>&1; then
            RELEASE_COMMIT="$(git ls-remote --tags origin "refs/tags/v$VER^{}" | cut -f1)"
            if [ -z "$RELEASE_COMMIT" ]; then
              RELEASE_COMMIT="$(git ls-remote --tags origin "refs/tags/v$VER" | cut -f1)"
            fi
            if [ "$RELEASE_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::v$VER 已对应另一个源码版本。请提高 VERSION 再发布。"
              exit 1
            fi
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "版本号：$VER"

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      # 声音克隆用的 MLX 要编译 Metal 着色器；新版 Xcode 的 Metal 工具链需要单独下载
      - name: Metal toolchain
        continue-on-error: true
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch llama.xcframework
        run: bash scripts/fetch_llama.sh

      - name: Prepare app icon
        run: bash scripts/prepare_assets.sh

      - name: Generate project
        run: |
          # 打印一下关键代码，确认编译的是最新的（之前出现过编译到旧代码的情况）
          echo "--- HEAD: $(git log -1 --format='%H %s') ---"
          sed -n '125,145p' apps/ios/Hear/Translate/LlamaTranslator.swift
          xcodegen generate --spec apps/ios/project.yml

      - name: Session regression tests
        run: |
          swiftc -parse-as-library -import-objc-header apps/ios/Hear/Models/ModelArchive-Bridging-Header.h \
            apps/ios/Hear/App/SessionJobQueue.swift apps/ios/Hear/App/SpeakerTracker.swift apps/ios/Hear/Models/Language.swift \
            apps/ios/Hear/Models/ZipVoiceArchive.swift apps/ios/Hear/Cloud/CloudModelReadiness.swift \
            apps/ios/Hear/Translate/PromptBuilder.swift apps/ios/Hear/Translate/TranslationOutput.swift apps/ios/Hear/Audio/Segmenter.swift apps/ios/Hear/Audio/CloneAudio.swift \
            apps/ios/Hear/Speech/SpeechTextFilter.swift apps/ios/Hear/Speech/Fillers.swift apps/ios/Hear/Cloud/CloudInferencePolicy.swift \
            apps/ios/Hear/Audio/AudioInputBuffer.swift apps/ios/Hear/Cloud/CloudPairingAddress.swift apps/ios/Hear/App/SessionClonePipeline.swift apps/ios/Hear/App/SessionCloudRecovery.swift \
            apps/ios/Hear/App/SessionPreviewPipeline.swift apps/ios/Hear/App/SenseVoiceRecovery.swift apps/ios/Hear/App/CloudSettingsSyncPolicy.swift \
            apps/ios/Hear/App/SessionRecognitionPipeline.swift apps/ios/Hear/App/SessionTranslationPipeline.swift \
            apps/ios/Hear/Models/ConversationModels.swift apps/ios/Hear/Summary/SummaryTemplate.swift \
            apps/ios/tests/SessionJobQueueTests.swift -lbz2 -o "$RUNNER_TEMP/hear-session-tests"
          "$RUNNER_TEMP/hear-session-tests"

      - name: Build
        run: |
          # 一定要留住 xcodebuild 的退出码：
          # 以前用 `| tee | grep ... || true`，退出码被吞了，
          # 只能靠"产物在不在"来判断——有的失败场景会误判成成功。
          RC=0
          xcodebuild \
            -project apps/ios/Hear.xcodeproj \
            -scheme Hear \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=${VER} HEAR_SOURCE_REVISION="$GITHUB_SHA" \
            build > build.log 2>&1 || RC=$?
          grep -E "error:|warning: .*deprecated|BUILD" build.log | tail -30 || true
          if [ "$RC" -ne 0 ] || ! test -f build/Build/Products/Release-iphoneos/Hear.app/Hear; then
            echo "::error::编译失败（xcodebuild 退出码 $RC），错误如下："
            grep -E "error:" build.log | sed 's|.*/apps/ios/Hear/||' | sort -u | head -40
            exit 1
          fi

      - name: Package IPA
        run: |
          test -s build/Build/Products/Release-iphoneos/Hear.app/silero_vad.onnx
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Hear.app Payload/
          # 文件名带上平台和版本号，例如 Hear-iOS-1.0.0.ipa
          zip -qry "Hear-iOS-${VER}.ipa" Payload
          ls -lh "Hear-iOS-${VER}.ipa"

      # 相同版本只重试同一个源码提交。
      - name: Publish release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v${VER}"
          {
            echo "## 听见 iOS ${VER}"
            echo ""
            echo "**更新内容：** $(printf '%s' "${COMMIT_MSG:-手动打包}" | head -1)"
            echo ""
            echo "源代码提交：$(git rev-parse HEAD)"
            echo "构建号：${GITHUB_RUN_NUMBER}"
            echo "llama.cpp：$(cat apps/ios/Frameworks/LLAMA_VERSION)"
            echo ""
            echo "### 安装"
            echo "1. 下载下面的 \`Hear-iOS-${VER}.ipa\`"
            echo "2. 用 [Sideloadly](https://sideloadly.io) + 你的 Apple ID 安装到 iPhone"
            echo "3. 已安装过的直接覆盖安装，模型不用重新下载"
          } > notes.md
          # 一个版本只保留一个发行标签，例如 v0.4.69。
          # 同一版本重新构建时只覆盖 IPA 与说明，不再生成 -build.N 小版本。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "听见 iOS ${VER}" --notes-file notes.md --latest
            gh release upload "$TAG" "Hear-iOS-$VER.ipa" --clobber
          else
            gh release create "$TAG" "Hear-iOS-$VER.ipa" --target "$GITHUB_SHA" \
              --title "听见 iOS ${VER}" --notes-file notes.md --latest
          fi

      - name: Update SideStore source
        if: env.PUBLISH_RELEASE == 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          IPA_SIZE=$(stat -f%z "Hear-iOS-${VER}.ipa")
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export VER IPA_SIZE NOW_UTC BUNDLE_ID
          python3 - <<'PY'
          import json, os, pathlib

          p = pathlib.Path("docs/sidestore.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          ver = os.environ["VER"]
          size = int(os.environ["IPA_SIZE"])
          now = os.environ["NOW_UTC"]
          bundle_id = os.environ["BUNDLE_ID"]
          msg = (os.environ.get("COMMIT_MSG") or f"听见 iOS {ver}").splitlines()[0].strip()
          dl = f"https://github.com/qianyueping1211/Hear/releases/download/v{ver}/Hear-iOS-{ver}.ipa"

          app = data["apps"][0]
          app["bundleIdentifier"] = bundle_id
          app["version"] = ver
          app["versionDate"] = now
          app["versionDescription"] = msg
          app["downloadURL"] = dl
          app["size"] = size

          versions = [v for v in app.get("versions", []) if v.get("version") != ver]
          versions.insert(0, {
              "version": ver,
              "date": now,
              "localizedDescription": msg,
              "downloadURL": dl,
              "size": size,
              "minOSVersion": "18.0",
          })
          app["versions"] = versions[:10]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sidestore.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(sidestore): update source for v${VER} [no release]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      # 只在失败时上传编译日志，方便排查；安装包只发布到 Releases
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: build-log
          path: build.log
