name: Build IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 只改“旧版本号改名”工作流时不打包
    # 只改电脑上的服务端脚本（server/）时也不用重新打包 App
    paths-ignore:
      - .github/workflows/rename-releases.yml
      - 'server/**'
      - 'docs/**'
      - README.md

permissions:
  contents: write

# 新提交来了就取消还在排队/运行的旧打包，节省排队时间
concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.hear.app
      TEAM_ID: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      # 版本号写在仓库根目录的 VERSION 文件里（三位，例如 1.0.0），每次发布前改这个文件
      - name: Version
        run: |
          VER=$(tr -d ' \r\n' < VERSION)
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION 文件格式不对：$VER（应为 1.0.0 这样的三位）"; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "版本号：$VER"

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      # 声音克隆用的 MLX 要编译 Metal 着色器；新版 Xcode 的 Metal 工具链需要单独下载
      - name: Metal toolchain
        continue-on-error: true
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch llama.xcframework
        run: bash scripts/fetch_llama.sh

      - name: Prepare app icon
        run: bash scripts/prepare_assets.sh

      - name: Generate project
        run: |
          # 打印一下关键代码，确认编译的是最新的（之前出现过编译到旧代码的情况）
          echo "--- HEAD: $(git log -1 --format='%H %s') ---"
          sed -n '125,145p' Hear/Translate/LlamaTranslator.swift
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Hear.xcodeproj \
            -scheme Hear \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=${VER} \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          if ! test -f build/Build/Products/Release-iphoneos/Hear.app/Hear; then
            echo "::error::编译失败，错误如下："
            grep -E "error:" build.log | sed 's|.*/Hear/Hear/||' | sort -u | head -40
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Hear.app Payload/
          # 文件名带上版本号，例如 Hear-1.0.0.ipa
          zip -qry "Hear-${VER}.ipa" Payload
          ls -lh "Hear-${VER}.ipa"

      # 发布：标签和标题都用版本号（例如 v1.0.0 / 听见 1.0.0）。同一版本号重新打包会覆盖原来的发布
      - name: Publish release
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v${VER}"
          {
            echo "## 听见 ${VER}"
            echo ""
            echo "**更新内容：** $(printf '%s' "${COMMIT_MSG:-手动打包}" | head -1)"
            echo ""
            echo "llama.cpp：$(cat Frameworks/LLAMA_VERSION)"
            echo ""
            echo "### 安装"
            echo "1. 下载下面的 \`Hear-${VER}.ipa\`"
            echo "2. 用 [Sideloadly](https://sideloadly.io) + 你的 Apple ID 安装到 iPhone"
            echo "3. 已安装过的直接覆盖安装，模型不用重新下载"
          } > notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "Hear-${VER}.ipa" \
            --title "听见 ${VER}" \
            --notes-file notes.md \
            --latest

      # 只在失败时上传编译日志，方便排查；安装包只发布到 Releases
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: build-log
          path: build.log
