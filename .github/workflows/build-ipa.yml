name: Build IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 只改“旧版本号改名”工作流时不打包
    # 只改电脑上的服务端脚本（server/）时也不用重新打包 App
    paths-ignore:
      - .github/workflows/rename-releases.yml
      - .github/workflows/server-contract.yml
      - start-hear-cloud.bat
      - VERSION
      - 'server/**'
      - 'docs/**'
      - README.md

permissions:
  contents: write

# 新提交来了就取消还在排队/运行的旧打包，节省排队时间
concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.hear.app
      TEAM_ID: ""
      GH_TOKEN: ${{ github.token }}
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no release]') }}
    steps:
      - uses: actions/checkout@v5

      # 证书和私钥绝对不能进仓库（2026-11 误提交过一次，已经作废重签了）
      - name: Guard against committed secrets
        run: |
          BAD=$(git ls-files | grep -Ei '\.(pem|key|p12|pfx|jks)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::仓库里有证书/私钥文件，请删掉并加进 .gitignore："
            echo "$BAD"
            exit 1
          fi
          PAT="PRIVATE ""KEY"
          HITS=$(git grep -Il -e "$PAT" -- . || true)
          if [ -n "$HITS" ]; then
            echo "::error::仓库里有私钥内容，不能提交："
            echo "$HITS"
            exit 1
          fi
          echo "✅ 仓库里没有证书/私钥"


      # 版本号写在仓库根目录的 VERSION 文件里（三位，例如 1.0.0），每次发布前改这个文件
      - name: Version
        run: |
          VER=$(tr -d ' \r\n' < VERSION)
          echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION 文件格式不对：$VER（应为 1.0.0 这样的三位）"; exit 1; }
          if [ "$PUBLISH_RELEASE" = "true" ] && gh release view "v$VER" >/dev/null 2>&1; then
            RELEASE_COMMIT="$(git ls-remote --tags origin "refs/tags/v$VER^{}" | cut -f1)"
            if [ -z "$RELEASE_COMMIT" ]; then
              RELEASE_COMMIT="$(git ls-remote --tags origin "refs/tags/v$VER" | cut -f1)"
            fi
            if [ "$RELEASE_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::v$VER 已对应另一个源码版本。请提高 VERSION 再发布。"
              exit 1
            fi
          fi
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "版本号：$VER"

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      # 声音克隆用的 MLX 要编译 Metal 着色器；新版 Xcode 的 Metal 工具链需要单独下载
      - name: Metal toolchain
        continue-on-error: true
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch llama.xcframework
        run: bash scripts/fetch_llama.sh

      - name: Prepare app icon
        run: bash scripts/prepare_assets.sh

      - name: Generate project
        run: |
          # 打印一下关键代码，确认编译的是最新的（之前出现过编译到旧代码的情况）
          echo "--- HEAD: $(git log -1 --format='%H %s') ---"
          sed -n '125,145p' Hear/Translate/LlamaTranslator.swift
          xcodegen generate

      - name: Session regression tests
        run: |
          swiftc -parse-as-library -import-objc-header Hear/Models/ModelArchive-Bridging-Header.h \
            Hear/App/SessionJobQueue.swift Hear/App/SpeakerTracker.swift Hear/Models/Language.swift \
            Hear/Models/ZipVoiceArchive.swift Hear/Cloud/CloudModelReadiness.swift \
            Hear/Translate/PromptBuilder.swift Hear/Translate/TranslationOutput.swift Hear/Audio/Segmenter.swift Hear/Audio/CloneAudio.swift \
            Hear/Speech/SpeechTextFilter.swift Hear/Speech/Fillers.swift Hear/Cloud/CloudInferencePolicy.swift \
            Hear/Audio/AudioInputBuffer.swift Hear/Cloud/CloudPairingAddress.swift Hear/App/SessionClonePipeline.swift Hear/App/SessionCloudRecovery.swift \
            Hear/App/SessionPreviewPipeline.swift Hear/App/SenseVoiceRecovery.swift \
            Hear/App/SessionRecognitionPipeline.swift Hear/App/SessionTranslationPipeline.swift \
            Hear/Models/ConversationModels.swift Hear/Summary/SummaryTemplate.swift \
            tests/SessionJobQueueTests.swift -lbz2 -o "$RUNNER_TEMP/hear-session-tests"
          "$RUNNER_TEMP/hear-session-tests"

      - name: Build
        run: |
          # 一定要留住 xcodebuild 的退出码：
          # 以前用 `| tee | grep ... || true`，退出码被吞了，
          # 只能靠"产物在不在"来判断——有的失败场景会误判成成功。
          RC=0
          xcodebuild \
            -project Hear.xcodeproj \
            -scheme Hear \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=${VER} HEAR_SOURCE_REVISION="$GITHUB_SHA" \
            build > build.log 2>&1 || RC=$?
          grep -E "error:|warning: .*deprecated|BUILD" build.log | tail -30 || true
          if [ "$RC" -ne 0 ] || ! test -f build/Build/Products/Release-iphoneos/Hear.app/Hear; then
            echo "::error::编译失败（xcodebuild 退出码 $RC），错误如下："
            grep -E "error:" build.log | sed 's|.*/Hear/Hear/||' | sort -u | head -40
            exit 1
          fi

      - name: Package IPA
        run: |
          test -s build/Build/Products/Release-iphoneos/Hear.app/silero_vad.onnx
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Hear.app Payload/
          # 文件名带上版本号，例如 Hear-1.0.0.ipa
          zip -qry "Hear-${VER}.ipa" Payload
          ls -lh "Hear-${VER}.ipa"

      # 相同版本只重试同一个源码提交。
      - name: Publish release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v${VER}"
          {
            echo "## 听见 ${VER}"
            echo ""
            echo "**更新内容：** $(printf '%s' "${COMMIT_MSG:-手动打包}" | head -1)"
            echo ""
            echo "源代码提交：$(git rev-parse HEAD)"
            echo "构建号：${GITHUB_RUN_NUMBER}"
            echo "llama.cpp：$(cat Frameworks/LLAMA_VERSION)"
            echo ""
            echo "### 安装"
            echo "1. 下载下面的 \`Hear-${VER}.ipa\`"
            echo "2. 用 [Sideloadly](https://sideloadly.io) + 你的 Apple ID 安装到 iPhone"
            echo "3. 已安装过的直接覆盖安装，模型不用重新下载"
          } > notes.md
          # 一个版本只保留一个发行标签，例如 v0.4.69。
          # 同一版本重新构建时只覆盖 IPA 与说明，不再生成 -build.N 小版本。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "听见 ${VER}" --notes-file notes.md --latest
            gh release upload "$TAG" "Hear-$VER.ipa" --clobber
          else
            gh release create "$TAG" "Hear-$VER.ipa" --target "$GITHUB_SHA" \
              --title "听见 ${VER}" --notes-file notes.md --latest
          fi

      # 只在失败时上传编译日志，方便排查；安装包只发布到 Releases
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: build-log
          path: build.log
