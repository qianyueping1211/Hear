name: Check build (compile only)

# Debug 编译和真机回归包。正式安装包由 build-ipa.yml 构建。
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'Hear/**'
      - 'tests/**'
      - 'project.yml'
      - 'scripts/**'
      - 'Frameworks/LLAMA_VERSION'
      - '.github/workflows/check-build.yml'

permissions:
  contents: read

concurrency:
  group: check-build
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BUNDLE_ID: com.hear.app
      TEAM_ID: ""
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      # 证书和私钥绝对不能进仓库（2026-11 误提交过一次，已经作废重签了）
      - name: Guard against committed secrets
        run: |
          BAD=$(git ls-files | grep -Ei '\.(pem|key|p12|pfx|jks)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::仓库里有证书/私钥文件，请删掉并加进 .gitignore："
            echo "$BAD"
            exit 1
          fi
          PAT="PRIVATE ""KEY"
          HITS=$(git grep -Il -e "$PAT" -- . || true)
          if [ -n "$HITS" ]; then
            echo "::error::仓库里有私钥内容，不能提交："
            echo "$HITS"
            exit 1
          fi
          echo "✅ 仓库里没有证书/私钥"


      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Metal toolchain
        continue-on-error: true
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch llama.xcframework
        run: bash scripts/fetch_llama.sh

      - name: Prepare app icon
        run: bash scripts/prepare_assets.sh

      - name: Generate project
        run: |
          # 打印一下关键代码，确认编译的是最新的（之前出现过编译到旧代码的情况）
          echo "--- HEAD: $(git log -1 --format='%H %s') ---"
          sed -n '125,145p' Hear/Translate/LlamaTranslator.swift
          xcodegen generate

      - name: Session regression tests
        run: |
          swiftc -parse-as-library -import-objc-header Hear/Models/ModelArchive-Bridging-Header.h \
            Hear/App/SessionJobQueue.swift Hear/App/SpeakerTracker.swift Hear/Models/Language.swift \
            Hear/Models/ZipVoiceArchive.swift Hear/Cloud/CloudModelReadiness.swift \
            Hear/Translate/PromptBuilder.swift Hear/Translate/TranslationOutput.swift Hear/Audio/Segmenter.swift Hear/Audio/CloneAudio.swift \
            Hear/Speech/SpeechTextFilter.swift Hear/Speech/Fillers.swift Hear/Cloud/CloudInferencePolicy.swift \
            Hear/Audio/AudioInputBuffer.swift Hear/Cloud/CloudPairingAddress.swift Hear/App/SessionClonePipeline.swift Hear/App/SessionCloudRecovery.swift \
            Hear/App/SessionPreviewPipeline.swift Hear/App/SenseVoiceRecovery.swift \
            Hear/App/SessionRecognitionPipeline.swift Hear/App/SessionTranslationPipeline.swift \
            Hear/Models/ConversationModels.swift Hear/Summary/SummaryTemplate.swift \
            tests/SessionJobQueueTests.swift -lbz2 -o "$RUNNER_TEMP/hear-session-tests"
          "$RUNNER_TEMP/hear-session-tests"

      - name: Build
        run: |
          # 一定要留住 xcodebuild 的退出码：
          # 以前用 `| tee | grep ... || true`，退出码被吞了，
          # 只能靠"产物在不在"来判断——有的失败场景会误判成成功。
          RC=0
          xcodebuild \
            -project Hear.xcodeproj \
            -scheme Hear \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG HEAR_SOURCE_REVISION="$GITHUB_SHA" \
            build > build.log 2>&1 || RC=$?
          grep -E "error:|BUILD" build.log | tail -30 || true
          if [ "$RC" -ne 0 ] || ! test -f build/Build/Products/Debug-iphoneos/Hear.app/Hear; then
            echo "::error::编译失败（xcodebuild 退出码 $RC），错误如下："
            grep -E "error:" build.log | sed 's|.*/Hear/Hear/||' | sort -u | head -40
            exit 1
          fi
          echo "✅ 编译通过"

      - name: Package device regression build
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/Hear.app Payload/
          zip -qry "Hear-Speech-Regression.ipa" Payload

      - uses: actions/upload-artifact@v6
        with:
          name: Hear-Speech-Regression
          path: Hear-Speech-Regression.ipa
