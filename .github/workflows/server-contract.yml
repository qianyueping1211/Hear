name: Server contract test

# 检查电脑上跑的那个云端服务，它的接口约定没变
# （App 依赖 /health、/v1/pair、/v1/asr 等接口的形状）
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'tests/audio/**'
      - '.github/workflows/server-contract.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'tests/audio/**'
      - '.github/workflows/server-contract.yml'

permissions:
  contents: read

concurrency:
  group: server-contract
  cancel-in-progress: true

jobs:
  sensevoice-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hear-audio-fixtures
          key: hear-sensevoice-2365bae-audio-v1
      - name: SenseVoice fixed-audio regression
        env:
          PYTHONUTF8: '1'
        run: |
          pip install sherpa-onnx==2.0.2 numpy==2.2.6
          python tests/audio/sensevoice_regression.py --cache "$RUNNER_TEMP/hear-audio-fixtures" \
            --baseline tests/audio/baseline.json --output "$RUNNER_TEMP/sensevoice-audio.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: sensevoice-audio
          path: ${{ runner.temp }}/sensevoice-audio.json

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Check launcher without downloading models
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $source = [IO.File]::ReadAllText((Resolve-Path 'server/start-windows.ps1'), [Text.Encoding]::UTF8)
          [void][System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors -join [Environment]::NewLine) }
          # 两个 BAT 里嵌入的 PowerShell 也要能解析
          foreach ($bat in @('server/windows/start-hear-cloud.bat', 'server/windows/start-hear-token-admin.bat')) {
            $text = [IO.File]::ReadAllText((Resolve-Path $bat), [Text.Encoding]::UTF8)
            $embedded = $text.Substring($text.LastIndexOf(':__HEAR_POWERSHELL__') + 20)
            [void][System.Management.Automation.Language.Parser]::ParseInput($embedded, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ("$bat`n" + ($errors -join [Environment]::NewLine)) }
          }
          cmd /d /c "server\windows\start-hear-cloud.bat --check"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /d /c "server\windows\start-hear-cloud.bat --help"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd /d /c "server\windows\start-hear-token-admin.bat --help"
          exit $LASTEXITCODE

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install cryptography

      - name: Contract test
        run: python3 server/test_contract.py

      - name: Token service and managed gateway auth test
        run: python3 server/test_token_auth.py

      # 顺便用给 Windows 用的那个自测脚本测一下 /health（翻译要模型，CI 里没有，所以只测健康检查）
      - name: Start service
        env:
          HEAR_PORT: '8200'
        run: |
          nohup python3 server/hear_cloud.py > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sk https://127.0.0.1:8200/health >/dev/null 2>&1; then
              echo "service is up"
              break
            fi
            sleep 1
          done
          tail -30 server.log

      - name: API self-test (health)
        run: python3 server/test_api.py health --url https://127.0.0.1:8200

      - name: Stop service
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
