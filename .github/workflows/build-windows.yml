name: Build Windows x64 Installer (.exe)

on:
  workflow_dispatch:
  push:
    branches: [main]
    # 与 iOS 完全解耦：仅当 apps/desktop/、共用 server 核心文件或本工作流变更时触发
    paths:
      - 'apps/desktop/**'
      - 'server/hear_cloud.py'
      - 'server/hear_http.py'
      - 'server/hear_auth.py'
      - 'server/hear_speaker.py'
      - 'server/requirements.txt'
      - 'server/start-windows.ps1'
      - 'server/windows/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'server/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server Regression & Desktop Extensions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt
      - name: Install minimal test dependencies
        run: pip install cryptography numpy
      - name: Run desktop server extension tests
        run: python -u server/test_desktop_extensions.py
      - name: Run token auth regression tests
        run: python -u server/test_token_auth.py

  build:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    needs: server-tests
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      ver: ${{ steps.version.outputs.ver }}
      tag: ${{ steps.version.outputs.tag }}
      asset: ${{ steps.version.outputs.asset }}
      publish_release: ${{ steps.version.outputs.publish_release }}
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no release]')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard against committed secrets
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '\.(pem|key|p12|pfx|jks|p8|cred|db)$|access-token\.txt$'
          if ($bad) {
            Write-Error "仓库包含敏感证书/私钥/数据库文件，请移除并加入 .gitignore：`n$($bad -join "`n")"
            exit 1
          }
          $pat = "PRIVATE " + "KEY"
          $hits = git grep -Il -e $pat -- .
          $global:LASTEXITCODE = 0
          if ($hits) {
            Write-Error "仓库包含私钥内容，禁止提交：`n$($hits -join "`n")"
            exit 1
          }
          Write-Host "OK: 未检测到证书/私钥文件"
          exit 0

      # Windows 版本号独立写在 apps/desktop/VERSION（例如 0.1.2），每次发布前提高该文件
      - name: Version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content -Raw apps/desktop/VERSION).Trim()
          if ($ver -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "apps/desktop/VERSION 格式不对：$ver（应为 0.1.0 这样的三位版本号）"
            exit 1
          }
          $tag = "win-v$ver"
          $asset = "Hear-Win-$ver.exe"
          if ($env:PUBLISH_RELEASE -eq "true") {
            gh release view $tag 2>$null | Out-Null
            $releaseExists = ($LASTEXITCODE -eq 0)
            $global:LASTEXITCODE = 0
            if ($releaseExists) {
              $releaseCommit = (git ls-remote --tags origin "refs/tags/$tag^{}" | ForEach-Object { ($_ -split "`t")[0] })
              if (-not $releaseCommit) {
                $releaseCommit = (git ls-remote --tags origin "refs/tags/$tag" | ForEach-Object { ($_ -split "`t")[0] })
              }
              if ($releaseCommit -and $releaseCommit -ne $env:GITHUB_SHA) {
                Write-Host "::notice::$tag 已发布，本次提交未提高 apps/desktop/VERSION，仅执行构建验证，跳过重复发布 Release。"
                $env:PUBLISH_RELEASE = "false"
              }
            }
          }
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish_release=$env:PUBLISH_RELEASE" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Windows 版本号：$ver（标签：$tag，安装包：$asset）"
          exit 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync apps/desktop/VERSION into package.json, Cargo.toml, tauri.conf.json
        shell: pwsh
        run: python apps/desktop/scripts/sync_desktop_version.py

      - name: Prepare desktop icons & build frontend
        working-directory: apps/desktop
        shell: pwsh
        run: |
          python scripts/prepare_desktop_icons.py
          npm install
          npx tauri icon src-tauri/icons/icon.png
          npm run build

      - name: Run Rust unit tests
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        run: cargo test

      - name: Build Windows x64 NSIS installer (.exe)
        working-directory: apps/desktop
        shell: pwsh
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Rename installer to Hear-Win-<VERSION>.exe
        shell: pwsh
        run: |
          $asset = "${{ steps.version.outputs.asset }}"
          $nsisDir = "apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $exe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Error "未在 $nsisDir 找到 NSIS 安装包 (.exe)"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path release-out | Out-Null
          Copy-Item $exe.FullName "release-out/$asset" -Force
          Get-Item "release-out/$asset" | Format-List Name, Length

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset }}
          path: release-out/${{ steps.version.outputs.asset }}
          if-no-files-found: error

  build-server-bundle:
    name: Build Windows x64 Server Bundle (.zip)
    runs-on: windows-latest
    needs: server-tests
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      server_asset: ${{ steps.bundle.outputs.server_asset }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Build standalone Windows Server bundle (embedded Python + faster-whisper + sherpa-onnx)
        id: bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Get-Content -Raw apps/desktop/VERSION).Trim()
          $folderName = "Hear-Server-Win-$ver"
          $serverAsset = "$folderName.zip"
          $stage = Join-Path $PWD "server-stage\$folderName"
          $srvOut = Join-Path $stage "server"
          $runtimeDir = Join-Path $srvOut "runtime"
          $sitePackages = Join-Path $runtimeDir "Lib\site-packages"
          New-Item -ItemType Directory -Force -Path $srvOut, $runtimeDir, $sitePackages, "release-out" | Out-Null

          # 1. 下载官方可移植 Python 3.12 Embedded 运行时（约 11 MB，自带 vcruntime / sqlite3 / openssl）
          $pyEmbedUrl = "https://www.python.org/ftp/python/3.12.9/python-3.12.9-embed-amd64.zip"
          $pyEmbedZip = Join-Path $env:RUNNER_TEMP "python-3.12.9-embed-amd64.zip"
          if (-not (Test-Path $pyEmbedZip)) {
            Invoke-WebRequest -UseBasicParsing -Uri $pyEmbedUrl -OutFile $pyEmbedZip
          }
          Expand-Archive -Path $pyEmbedZip -DestinationPath $runtimeDir -Force

          # 配置 python312._pth，启用 site-packages 并自动加入 server/ 目录
          $pthContent = @(
            "python312.zip",
            ".",
            "Lib\site-packages",
            "..",
            "import site"
          ) -join "`r`n"
          [IO.File]::WriteAllText((Join-Path $runtimeDir "python312._pth"), $pthContent, [Text.Encoding]::ASCII)

          # 2. 预装全部服务端依赖（faster-whisper / ctranslate2 / av / numpy / sherpa-onnx / cryptography）
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary --target "$sitePackages" -r server/requirements.txt

          # 3. 拷贝服务端脚本与启动入口
          foreach ($bat in @("start-hear-cloud.bat", "start-hear-token-admin.bat")) {
            $batSrc = Join-Path "server\windows" $bat
            if (Test-Path $batSrc) { Copy-Item $batSrc $stage -Force }
          }
          if (Test-Path "docs/windows-deploy.md") {
            Copy-Item "docs/windows-deploy.md" (Join-Path $stage "使用说明.md") -Force
          }
          $serverFiles = @(
            "start-windows.ps1", "hear_cloud.py", "hear_http.py", "hear_speaker.py",
            "make_cert.py", "requirements.txt", "test_api.py", "test_contract.py",
            "test_desktop_extensions.py", "hear_auth.py", "hear_check_token.py",
            "hear_token_store.py", "hear_token_service.py",
            "hear_token_admin.html", "hear_token_admin.js", "hear_token_admin.css",
            "test_token_auth.py", "README.md", "TOKEN_ADMIN.md"
          )
          foreach ($f in $serverFiles) {
            $src = Join-Path "server" $f
            if (Test-Path $src) { Copy-Item $src $srvOut -Force }
          }

          # 4. 隔离环境全量自检：确保不依赖系统 Python 即可完整导入全部模型库并通过测试
          $bundledPy = Join-Path $runtimeDir "python.exe"
          $env:PYTHONPATH = ""
          $env:PYTHONHOME = ""
          & $bundledPy -c "import sqlite3, ssl, faster_whisper, sherpa_onnx, av, numpy, cryptography; print('BUNDLED RUNTIME OK:', faster_whisper.__version__, sherpa_onnx.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bundledPy -u (Join-Path $srvOut "test_desktop_extensions.py")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $stage
          cmd /d /c "start-hear-cloud.bat --check"
          $checkRc = $LASTEXITCODE
          Pop-Location
          if ($checkRc -ne 0) { exit $checkRc }

          # 5. 打包为便携 zip
          $zipPath = Join-Path $PWD "release-out\$serverAsset"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          7z a -tzip -mx=5 "$zipPath" "$stage" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item $zipPath | Format-List Name, Length
          "server_asset=$serverAsset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Upload Windows Server bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.server_asset }}
          path: release-out/${{ steps.bundle.outputs.server_asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release (听见 Windows)
    runs-on: ubuntu-latest
    needs: [build, build-server-bundle]
    if: needs.build.outputs.publish_release == 'true'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VER: ${{ needs.build.outputs.ver }}
      TAG: ${{ needs.build.outputs.tag }}
      ASSET: ${{ needs.build.outputs.asset }}
      SERVER_ASSET: ${{ needs.build-server-bundle.outputs.server_asset }}
      COMMIT_MSG: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: release-out
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.SERVER_ASSET }}
          path: release-out
      - name: Create or update Release
        run: |
          TITLE="听见 Windows ${VER}"
          {
            echo "## ${TITLE}"
            echo ""
            echo "**更新内容：** $(printf '%s' "${COMMIT_MSG:-手动打包}" | head -1)"
            echo ""
            echo "源代码提交：$(git rev-parse HEAD)"
            echo "构建号：${GITHUB_RUN_NUMBER}"
            echo ""
            echo "### 附件说明"
            echo "1. **客户端安装包** \`${ASSET}\`：Windows x64 桌面客户端（纯客户端，免管理员安装，支持悬浮字幕、托盘常驻与自动更新）"
            echo "2. **本机服务端整合包** \`${SERVER_ASSET}\`：已内置独立 Python 3.12 与全套语音识别依赖（\`faster-whisper\` / \`sherpa-onnx\` / \`av\` / \`numpy\` / \`cryptography\`），**无需手动安装 Python 或 pip**，解压后双击 \`start-hear-cloud.bat\` 即可一键启动全部三模型服务"
            echo ""
            echo "### 使用步骤"
            echo "1. 安装并打开 \`${ASSET}\`（已有旧版本直接覆盖安装即可）"
            echo "2. 若需在本机运行模型服务：解压 \`${SERVER_ASSET}\` 后双击 \`start-hear-cloud.bat\`，在客户端「设置 → 模型服务」中点击「测试连接」验证三模型就绪"
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "${TITLE}" --notes-file notes.md
            gh release upload "$TAG" "release-out/${ASSET}" "release-out/${SERVER_ASSET}" --clobber
          else
            gh release create "$TAG" "release-out/${ASSET}" "release-out/${SERVER_ASSET}" --target "$GITHUB_SHA" \
              --title "${TITLE}" --notes-file notes.md
          fi
