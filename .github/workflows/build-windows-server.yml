name: Build Windows x64 Server Bundle (.zip)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/WIN_VERSION'
      - 'server/windows/**'
      - 'server/start-windows.ps1'
      - 'server/hear_cloud.py'
      - 'server/hear_http.py'
      - 'server/hear_auth.py'
      - 'server/hear_speaker.py'
      - 'server/hear_token_*.py'
      - 'server/hear_token_admin.*'
      - 'server/make_cert.py'
      - 'server/requirements.txt'
      - '.github/workflows/build-windows-server.yml'

permissions:
  contents: write

concurrency:
  group: build-windows-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-server:
    name: Build Windows x64 Server (.zip)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/requirements.txt

      - name: Version
        id: version
        shell: pwsh
        run: |
          $ver = (Get-Content -Raw server/WIN_VERSION).Trim()
          $tag = "win-server-v$ver"
          $asset = "Hear-Win-Server-$ver-x64.zip"
          "ver=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset=$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Windows Server 版本：$ver ($tag -> $asset)"

      - name: Build standalone Windows Server bundle (embedded Python + two .bat launchers)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = "${{ steps.version.outputs.ver }}"
          $asset = "${{ steps.version.outputs.asset }}"
          $stage = Join-Path $PWD "dist-windows-server\Hear-Win-Server-$ver-x64"
          $srvOut = Join-Path $stage "server"
          $runtimeDir = Join-Path $srvOut "runtime"
          $sitePackages = Join-Path $runtimeDir "Lib\site-packages"

          New-Item -ItemType Directory -Force -Path $sitePackages | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $PWD "dist-windows-server") | Out-Null

          # 1. 下载官方独立便携版 Python 3.12.9 embeddable (amd64)
          $pyEmbedUrl = "https://www.python.org/ftp/python/3.12.9/python-3.12.9-embed-amd64.zip"
          $pyEmbedZip = Join-Path $env:RUNNER_TEMP "python-3.12.9-embed-amd64.zip"
          if (-not (Test-Path $pyEmbedZip)) {
            Invoke-WebRequest -UseBasicParsing -Uri $pyEmbedUrl -OutFile $pyEmbedZip
          }
          Expand-Archive -Path $pyEmbedZip -DestinationPath $runtimeDir -Force

          $pthContent = @(
            "python312.zip",
            ".",
            "Lib\site-packages",
            "..",
            "import site"
          ) -join "`r`n"
          [IO.File]::WriteAllText((Join-Path $runtimeDir "python312._pth"), $pthContent, [Text.Encoding]::ASCII)

          # 2. 预装全部服务端依赖
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary --target "$sitePackages" -r server/requirements.txt

          # 3. 拷贝两个 .bat 启动器到压缩包根目录 + 服务端核心脚本到 server/
          foreach ($bat in @("start-hear-cloud.bat", "start-hear-token-admin.bat")) {
            Copy-Item (Join-Path "server\windows" $bat) $stage -Force
          }
          if (Test-Path "docs/windows-deploy.md") {
            Copy-Item "docs/windows-deploy.md" (Join-Path $stage "使用说明.md") -Force
          }
          $serverFiles = @(
            "start-windows.ps1", "hear_cloud.py", "hear_http.py", "hear_speaker.py",
            "make_cert.py", "requirements.txt", "test_api.py", "test_contract.py",
            "test_desktop_extensions.py", "hear_auth.py", "hear_check_token.py",
            "hear_token_store.py", "hear_token_service.py",
            "hear_token_admin.html", "hear_token_admin.js", "hear_token_admin.css",
            "test_token_auth.py", "README.md", "TOKEN_ADMIN.md"
          )
          foreach ($f in $serverFiles) {
            $src = Join-Path "server" $f
            if (Test-Path $src) { Copy-Item $src $srvOut -Force }
          }
          # 写入发布版标记文件，避免整合包每次启动自动被 main 分支源码覆盖
          [IO.File]::WriteAllText((Join-Path $srvOut ".hear-release"), "win-server-v$ver`n", [Text.Encoding]::UTF8)

          # 4. 隔离环境自检
          $bundledPy = Join-Path $runtimeDir "python.exe"
          $env:PYTHONPATH = ""
          $env:PYTHONHOME = ""
          & $bundledPy -c "import sqlite3, ssl, faster_whisper, sherpa_onnx, av, numpy, cryptography; print('BUNDLED RUNTIME OK:', faster_whisper.__version__, sherpa_onnx.__version__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bundledPy -u (Join-Path $srvOut "test_desktop_extensions.py")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $stage
          cmd /d /c "start-hear-cloud.bat --check"
          $rc1 = $LASTEXITCODE
          cmd /d /c "start-hear-token-admin.bat --help"
          $rc2 = $LASTEXITCODE
          Pop-Location
          if ($rc1 -ne 0) { exit $rc1 }
          if ($rc2 -ne 0) { exit $rc2 }

          # 5. 打包为 Hear-Win-Server-<VER>-x64.zip 并生成 .sha256 校验文件
          $zipPath = Join-Path $PWD "dist-windows-server\$asset"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          7z a -tzip -mx=5 "$zipPath" "$stage" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$zipPath.sha256", "$sha  $asset`n", [Text.Encoding]::ASCII)
          Get-Item $zipPath, "$zipPath.sha256" | Format-List Name, Length

      - name: Upload Windows Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset }}
          path: |
            dist-windows-server/${{ steps.version.outputs.asset }}
            dist-windows-server/${{ steps.version.outputs.asset }}.sha256
          retention-days: 30

      - name: Publish GitHub Release (听见 Windows 服务端)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $ver = "${{ steps.version.outputs.ver }}"
          $asset = "dist-windows-server/${{ steps.version.outputs.asset }}"
          $shaAsset = "$asset.sha256"
          $notes = @"
          听见 (Hear) Windows x64 服务端独立整合包 v${ver}：
          - 内置便携 Python 3.12 与全套语音识别/加密依赖（faster-whisper / sherpa-onnx / av / numpy / cryptography），免安装 Python
          - 包含两个一键启动脚本：start-hear-cloud.bat（启动三模型服务端）与 start-hear-token-admin.bat（多用户口令管理后台）
          - 解压后双击 start-hear-cloud.bat 即可启动，供 iPhone 与 Windows 客户端局域网或本机连接
          "@
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset $shaAsset --clobber
          } else {
            gh release create $tag $asset $shaAsset --title "听见 Win-Server v${ver}" --notes $notes
          }
