name: Hear
options:
  bundleIdPrefix: com.hear
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 1.0.0          # speech-swift 要求 1.0 以上
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.3
  SpeechSwift:           # 声音克隆朗读：Qwen3-TTS（MLX）
    url: https://github.com/soniqo/speech-swift
    branch: main

targets:
  Hear:
    type: application
    platform: iOS
    sources:
      - path: Hear
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: FluidAudio
        product: FluidAudio
      - package: SpeechSwift
        product: Qwen3TTS
      - framework: Frameworks/llama.xcframework
        embed: true
    info:
      path: Hear/Info.plist
      properties:
        CFBundleDisplayName: 听见
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 需要使用麦克风来识别你说的话并实时翻译（全部在本机完成）。
        NSSpeechRecognitionUsageDescription: 使用 iOS 系统听写在说话时实时显示文字（在本机完成）。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        MARKETING_VERSION: "1.0.0"        # 版本号：打包时用仓库根目录 VERSION 文件里的值
        CURRENT_PROJECT_VERSION: "1"      # 内部构建号：打包时自动递增
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${TEAM_ID}
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

schemes:
  Hear:
    build:
      targets:
        Hear: all
    run:
      config: Debug
    archive:
      config: Release
