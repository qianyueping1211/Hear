name: Hear
options:
  bundleIdPrefix: com.hear
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  SherpaOnnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    exactVersion: 1.13.8
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.3

targets:
  Hear:
    type: application
    platform: iOS
    sources:
      - path: Hear
    dependencies:
      - package: SherpaOnnx
        product: sherpa-onnx
      - package: FluidAudio
        product: FluidAudio
      - framework: Frameworks/llama.xcframework
        embed: true
      - sdk: libbz2.tbd
      - target: HearLiveActivity
        embed: true
    info:
      path: Hear/Info.plist
      properties:
        CFBundleDisplayName: 听见
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        HearSourceRevision: "$(HEAR_SOURCE_REVISION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 需要使用麦克风来识别你说的话并实时翻译（全部在本机完成）。
        # 连接自己电脑上的云端模型服务（同一个 Wi-Fi 下的局域网地址，用 http 明文）
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 需要访问你电脑上的云端模型服务（手机和电脑在同一个 Wi-Fi 下）。
        NSSpeechRecognitionUsageDescription: 使用 iOS 系统听写在说话时实时显示文字（在本机完成）。
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        MARKETING_VERSION: "1.0.0"        # 版本号：打包时用仓库根目录 VERSION 文件里的值
        CURRENT_PROJECT_VERSION: "1"      # 内部构建号：打包时自动递增
        HEAR_SOURCE_REVISION: "local"
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Hear/Models/ModelArchive-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${TEAM_ID}
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  HearLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: HearLiveActivity
      - path: Hear/LiveActivity/HearLiveActivityAttributes.swift
    info:
      path: HearLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: 听见实时翻译
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hear.app.liveactivity
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  Hear:
    build:
      targets:
        Hear: all
    run:
      config: Debug
    archive:
      config: Release
